name: Samsung Music debug APK

# Continuous check: builds the debug LSPosed APK for the Samsung Music retarget.
# No signing secrets involved; the APK lands in the run's artifacts.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'FAQ.md'
      - 'FEATURES_USER.md'
      - 'TRANSLITERATION.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK (Samsung Music retarget)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SpicyEX-samsungmusic-debug.apk
          ls -la SpicyEX-samsungmusic-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spicy-ex-samsungmusic-debug-apk
          path: SpicyEX-samsungmusic-debug.apk
