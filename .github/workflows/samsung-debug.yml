name: Samsung Music debug APK

# Continuous check: builds the debug LSPosed APK for the Samsung Music retarget.
# No signing secrets involved; the APK lands in the run's artifacts.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'FAQ.md'
      - 'FEATURES_USER.md'
      - 'TRANSLITERATION.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # The ubuntu runner ships a preinstalled Android SDK (licenses accepted).
      # Gradle/AGP fetches whatever platform/build-tools the build needs on top.

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Debug builds on CI would otherwise sign with a fresh, per-run keystore and
      # every artifact would refuse to update the previous one on-device. Decode the
      # committed throwaway debug key where app/build.gradle picks it up. Do not use
      # this key for anything real.
      - name: Materialize debug keystore
        run: |
          if [ -n "$RUNNER_DEBUG" ]; then :; fi
          git show HEAD --stat >/dev/null
          # only decode when the file is not already there (local Termux builds commit it decoded-free)
          base64 --decode < debug.keystore.b64 > debug.keystore
          true

      - name: Build debug APK (Samsung Music retarget)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SpicyEX-samsungmusic-debug.apk
          ls -la SpicyEX-samsungmusic-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spicy-ex-samsungmusic-debug-apk
          path: SpicyEX-samsungmusic-debug.apk
